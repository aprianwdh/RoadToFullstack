<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Switch</title>
  </head>
  <body>
    <script>
      let nilai = 69;

      switch (nilai) {
        case 100:
        case 90:
          document.writeln("A");
          break;
        case 70:
          document.writeln("b");
          break;
        case 60:
        case 50:
          document.writeln("c");
          break;
        default:
          document.writeln("hemmm");
      }
    </script>
  </body>
</html>
