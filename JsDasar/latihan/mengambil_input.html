<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mengambil input</title>
  </head>
  <body>
    <h1>Prograam Gatau</h1>
    <input type="text" name="nama" id="nama" placeholder="Masukkan Nama Anda" />
    <button type="submit" onclick="kirimNama()">kirim</button>
    <p id="hasil"></p>

    <script>
      function kirimNama() {
        let nama = document.querySelector("#nama").value;
        document.querySelector("#hasil").textContent = nama;
      }
    </script>
  </body>
</html>
