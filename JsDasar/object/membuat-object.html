<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Membuat object</title>
  </head>
  <body>
    <script>
      // cara membuat object
      let orang = {
        nama: "supriw",
        pangkat: "Sigma GYat Riez",
        alamat: "ngawi etan lor kidul",
      };
      console.log(orang);

      //   cara menambah object
      orang["anime_favorit"] = "Opler";
      console.log(orang);

      // cara mengambil data object
      console.log(
        `${orang.nama} berpangkat ${orang.pangkat} memiliki alamat di ${orang.alamat}`
      );
    </script>
  </body>
</html>
