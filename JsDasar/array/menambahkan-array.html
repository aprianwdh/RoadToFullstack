<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menambahkan array</title>
  </head>
  <body>
    <script>
      let data = [];

      //   menambahkan array ke urutan belakang pakai push
      data.push("aku");
      data.push("anak");
      data.push("SIGMA");

      // menampilkan data dalam bentuk tabel
      console.table(data);
    </script>
  </body>
</html>
