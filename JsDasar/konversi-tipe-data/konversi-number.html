<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>konversi number</title>
  </head>
  <body>
    <script>
      num1 = 97;
      num2 = "2.5";

      // akan di anggap penjumlahan string
      console.log(`hasil dari ${num1} + ${num2} adalah = ${num1 + num2}`);

      // konversi number
      num2 = Number(num2);
      console.log(`hasil dari ${num1} + ${num2} adalah = ${num1 + num2}`);
    </script>
  </body>
</html>
