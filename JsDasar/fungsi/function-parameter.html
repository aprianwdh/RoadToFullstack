<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>function parameter</title>
  </head>
  <body>
    <script>
      function salamOlahraga(namaDepan, namaBelakang, berapaKali) {
        document.writeln(
          `okey brader ${namaDepan} ${namaBelakang} ayo tak salam olahraga ${berapaKali} kali`
        );
      }

      salamOlahraga("brodi", "terkedi kedi", 10000);
    </script>
  </body>
