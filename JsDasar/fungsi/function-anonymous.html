<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anonymous function</title>
  </head>
  <body>
    <script>
      //anonymous function sebagai variabel
      const sum = function (angka1, angka2) {
        return angka1 + angka2;
      };

      document.writeln(sum(1, 2));

      //anonymous function sebagai argumen
      function pangkatDua(calback) {
        document.writeln(calback ** 2);
      }

      pangkatDua(sum(1, 2));
    </script>
  </body>
</html>
