<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nested function</title>
  </head>
  <body>
    <script>
      function outer(a, b) {
        function innera(a) {
          document.writeln(`ini inner ${a} <br>`);
        }

        function innerb(b) {
          document.writeln(`ini inner ${b}<br>`);
        }

        innera(a);
        innerb(b);
      }

      outer("aku", "kamu");
    </script>
  </body>
</html>
