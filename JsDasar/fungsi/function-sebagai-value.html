<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function sayHello(nama) {
        document.writeln(`hallo sayang ${nama} <br>`);
      }

      let func = sayHello;

      func("eunbi");
      sayHello("gran");

      //menggunakan function sebagai argument

      function say(callback, nama) {
        callback(nama);
      }
      say(sayHello, "eunbie");
      say(func, "eunbie");
    </script>
  </body>
</html>
