<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>local scope</title>
  </head>
  <body>
    <script>
      function first() {
        // ini adalah local scope (tidak bisa dipakai diluar functionnya)
        let firstVariabel = 1;
      }

      function second() {
        // ini adalah local scope (tidak bisa dipakai diluar functionnya)
        let secondVariabel = 2;
      }
    </script>
  </body>
</html>
