<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>While loop</title>
  </head>
  <body>
    <script>
      let angka = 0;
      while (angka < 5) {
        document.writeln(angka);
        angka++;
      }
    </script>
  </body>
</html>
