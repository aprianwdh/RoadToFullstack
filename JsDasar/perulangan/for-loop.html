<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>for loop</title>
  </head>
  <body>
    <script>
      // contoh penggunaan for
      for (let i = 0; i < 5; i++) {
        document.writeln(`perulangan ke-${i} <br>`);
      }

      //   penggunaan for pada list
      let nama = ["aprian", "widhi", "wibowo"];

      for (let i = 0; i < nama.length; i++) {
        document.writeln(`${nama[i]} <br>`);
      }
    </script>
  </body>
</html>
