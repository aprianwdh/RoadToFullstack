<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>and && di non boolean</title>
  </head>
  <body>
    <script>
      //akan mengambil dari kiri ke kanan yang merupakan falshy pertama
      //jika tidak ada satupun falshy yang paling kanan akan diambil
      document.writeln("" && "--");
      document.writeln("0" && 0);
      document.writeln("" && ["poko"]);
    </script>
  </body>
</html>
