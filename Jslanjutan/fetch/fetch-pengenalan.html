<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="load">tekan ini</button>
    <pre id="output"></pre>

    <script>
      // buat variabel untuk elemen elemen di html
      const buttonLoad = document.getElementById("load");
      const output = document.getElementById("output");

      //   function async
      async function loadData() {
        output.textContent = "loading maseh";

        // mengambil data dari link
        const respons = await fetch(
          "https://jsonplaceholder.typicode.com/posts/1"
        );
        // merubah data ke JSON
        const data = await respons.json();

        // tampilkan data dengan mengubah json object menjadi json string
        output.textContent = JSON.stringify(data, null, 2);
      }
      //   panggil loadData ketika tombol di klik
      buttonLoad.onclick = loadData;
    </script>
  </body>
</html>
