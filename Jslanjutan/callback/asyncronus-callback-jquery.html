<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>asyncronus callback with jquery</title>
  </head>
  <body>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script>
      $.ajax({
        url: "data.json",
        success: (nama) => {
          console.log(nama);
          for (i of nama) {
            console.log(i.nama);
          }
        },
        error: () => {
          console.log("error");
        },
      });
    </script>
  </body>
</html>
